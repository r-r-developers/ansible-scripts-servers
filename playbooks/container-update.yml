---
- name: Docker Container Management - Update Images and Restart Containers
  hosts: docker_hosts
  become: yes
  gather_facts: yes
  
  vars:
    # Set specific containers to update (leave empty for all)
    target_containers: []
    # Set to 'yes' to prune unused images after update
    prune_images: yes
    # Set to 'yes' to pull latest images even if container is not running
    force_pull: no
  
  tasks:
    - name: Check if Docker is available
      command: which docker
      register: docker_check
      changed_when: false
      ignore_errors: yes
      tags: always

    - name: Ensure Docker is installed
      apt:
        name: 
          - docker.io
          - docker-compose
        state: present
        update_cache: yes
      ignore_errors: yes
      register: docker_install
      when: docker_check.failed

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Get list of running containers
      command: docker ps --format "{{ '{{' }}.Names{{ '}}' }}"
      register: running_containers
      changed_when: false

    - name: Display running containers
      debug:
        msg: "Running containers: {{ running_containers.stdout_lines }}"

    - name: Get list of all containers (including stopped)
      command: docker ps -a --format "{{ '{{' }}.Names{{ '}}' }}"
      register: all_containers
      changed_when: false

    - name: Pull latest images for running containers
      shell: |
        container_name="{{ item }}"
        image=$(docker inspect --format='{{ '{{' }}.Config.Image{{ '}}' }}' "$container_name")
        echo "Pulling latest image for $container_name: $image"
        docker pull "$image"
      loop: "{{ target_containers if target_containers | length > 0 else running_containers.stdout_lines }}"
      register: pull_result
      changed_when: "'Downloaded newer image' in pull_result.stdout or 'Status: Downloaded' in pull_result.stdout"
      ignore_errors: yes
      when: running_containers.stdout_lines | length > 0

    - name: Restart containers with updated images
      shell: |
        container_name="{{ item }}"
        echo "Restarting container: $container_name"
        docker restart "$container_name"
      loop: "{{ target_containers if target_containers | length > 0 else running_containers.stdout_lines }}"
      register: restart_result
      ignore_errors: yes
      when: 
        - running_containers.stdout_lines | length > 0
        - pull_result.changed

    - name: Wait for containers to be healthy
      shell: |
        container_name="{{ item }}"
        timeout=60
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          status=$(docker inspect --format='{{ '{{' }}.State.Status{{ '}}' }}' "$container_name" 2>/dev/null || echo "not_found")
          if [ "$status" = "running" ]; then
            echo "Container $container_name is running"
            exit 0
          fi
          sleep 2
          elapsed=$((elapsed + 2))
        done
        echo "Container $container_name did not start within ${timeout}s"
        exit 1
      loop: "{{ target_containers if target_containers | length > 0 else running_containers.stdout_lines }}"
      when: 
        - running_containers.stdout_lines | length > 0
        - restart_result.changed
      register: health_check
      changed_when: false

    - name: Prune unused Docker images
      command: docker image prune -af
      register: prune_result
      when: prune_images | bool
      changed_when: "'Total reclaimed space' in prune_result.stdout"

    - name: Display prune results
      debug:
        msg: "{{ prune_result.stdout_lines }}"
      when: 
        - prune_images | bool
        - prune_result.changed

    - name: Show Docker disk usage
      command: docker system df
      register: disk_usage
      changed_when: false

    - name: Display Docker disk usage
      debug:
        msg: "{{ disk_usage.stdout_lines }}"
