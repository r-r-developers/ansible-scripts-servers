---
- name: System Updates - APT Update and Upgrade
  hosts: all
  become: yes
  gather_facts: yes
  
  vars:
    # Set to 'yes' to automatically reboot if required
    auto_reboot: no
    reboot_timeout: 600
  
  tasks:
    - name: Update APT package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      register: apt_update
      changed_when: apt_update.cache_updated

    - name: Upgrade all APT packages to latest version
      apt:
        upgrade: dist
        autoremove: yes
        autoclean: yes
      register: apt_upgrade

    - name: Display upgrade summary
      debug:
        msg: "{{ apt_upgrade.stdout_lines | default(['No updates available']) }}"

    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Display reboot requirement
      debug:
        msg: "System reboot is required!"
      when: reboot_required_file.stat.exists

    - name: Reboot the system if required and auto_reboot is enabled
      reboot:
        msg: "Reboot initiated by Ansible after system updates"
        connect_timeout: 5
        reboot_timeout: "{{ reboot_timeout }}"
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: 
        - reboot_required_file.stat.exists
        - auto_reboot | bool

    - name: Clean up old kernels and packages
      apt:
        autoremove: yes
        autoclean: yes
      register: cleanup

    - name: Display cleanup results
      debug:
        msg: "Cleanup completed successfully"
      when: cleanup.changed
