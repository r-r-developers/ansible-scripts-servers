---
# Ansible Inventory File
# Define your server groups and hosts here

all:
  children:
    # Production servers
    production:
      hosts:
        ubuntu-mini-production:
          ansible_host: 192.168.18.6
          ansible_user: rustin
          ansible_port: 22
        ubuntu-elite-mini:
          ansible_host: 192.168.18.4
          ansible_user: rustin
          ansible_port: 22
    
    # Development servers
    development:
      hosts:
        ubuntu-mini-non-production:
          ansible_host: 192.168.18.10
          ansible_user: rustin
          ansible_port: 22
        raspberry-pi-5b:
          ansible_host: 192.168.18.3
          ansible_user: rustin
          ansible_port: 22
    
    # Docker hosts (servers running containers)
    docker_hosts:
      hosts:
        raspberry-pi-5b:
          ansible_host: 192.168.18.3
          ansible_user: rustin
          ansible_port: 22
        ubuntu-mini-non-production:
          ansible_host: 192.168.18.10
          ansible_user: rustin
          ansible_port: 22
        ubuntu-mini-production:
          ansible_host: 192.168.18.6
          ansible_user: rustin
          ansible_port: 22
        ubuntu-elite-mini:
          ansible_host: 192.168.18.4
          ansible_user: rustin
          ansible_port: 22

  # Global variables for all hosts
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    # Uncomment if you want to use password authentication instead
    # ansible_ssh_pass: your_password
    # ansible_become_pass: your_sudo_password
