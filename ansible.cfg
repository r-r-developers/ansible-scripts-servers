[defaults]
# Disable host key checking (useful for dynamic environments)
host_key_checking = False

# Default inventory file
inventory = ./inventory/hosts.yml

# Use the free strategy for faster playbook execution
strategy = linear

# Increase timeout for slower connections
timeout = 30

# Default remote user
remote_user = rustin

# Enable password authentication
ask_pass = False

# Pipelining improves performance
pipelining = False

# Display skipped hosts
display_skipped_hosts = True

# Colorize output
force_color = True

# Use sudo for privilege escalation
[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH arguments for password authentication
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PreferredAuthentications=password -o PubkeyAuthentication=no
# Enable pipelining for better performance
pipelining = True
