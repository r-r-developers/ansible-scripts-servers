---
- name: Backup Linux Server Configuration
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check backup directory
      ansible.builtin.file:
        path: /var/backups
        state: directory
        mode: '0755'
      register: backup_check
      ignore_errors: true

    - name: Output backup directory status
      ansible.builtin.debug:
        msg: "Backup directory ready"

    - name: Create configuration backup
      ansible.builtin.shell: tar -czf /var/backups/config-$(date +%Y%m%d).tar.gz /etc
      register: backup_result
      ignore_errors: true

    - name: Output backup result
      ansible.builtin.debug:
        msg: "Backup result:\n{{ backup_result.stdout }}"

    - name: Verify backup created
      ansible.builtin.shell: ls -lh /var/backups/config-*.tar.gz | tail -n 5
      register: backup_list
      ignore_errors: true

    - name: Output recent backups
      ansible.builtin.debug:
        msg: "Recent backups:\n{{ backup_list.stdout }}"
