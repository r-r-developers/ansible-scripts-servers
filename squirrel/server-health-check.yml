---
- name: Health Check Linux Server
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check system uptime
      ansible.builtin.shell: uptime
      register: system_uptime
      ignore_errors: true

    - name: Output system uptime
      ansible.builtin.debug:
        msg: "System uptime:\n{{ system_uptime.stdout }}"

    - name: Check disk usage
      ansible.builtin.shell: df -h
      register: disk_usage
      ignore_errors: true

    - name: Output disk usage
      ansible.builtin.debug:
        msg: "Disk usage:\n{{ disk_usage.stdout }}"

    - name: Check running services
      ansible.builtin.shell: systemctl list-units --type=service --state=running
      register: running_services
      ignore_errors: true

    - name: Output running services
      ansible.builtin.debug:
        msg: "Running services:\n{{ running_services.stdout }}"
