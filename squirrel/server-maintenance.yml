---
- name: Linux Server Maintenance
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Clean package cache (Debian/Ubuntu)
      ansible.builtin.apt:
        autoclean: yes
      when: ansible_os_family == "Debian"
      register: clean_cache
      ignore_errors: true

    - name: Output cache cleanup result
      ansible.builtin.debug:
        msg: "Cache cleanup completed"
      when: ansible_os_family == "Debian"

    - name: Check system logs
      ansible.builtin.shell: journalctl -p err -n 50 --no-pager
      register: error_logs
      ignore_errors: true

    - name: Output recent errors
      ansible.builtin.debug:
        msg: "Recent errors:\n{{ error_logs.stdout }}"

    - name: Clean old log files
      ansible.builtin.shell: find /var/log -type f -name "*.log" -mtime +30 -delete
      register: log_cleanup
      ignore_errors: true

    - name: Clean old temporary files
      ansible.builtin.shell: find /tmp -type f -atime +7 -delete
      register: temp_cleanup
      ignore_errors: true

    - name: Output cleanup result
      ansible.builtin.debug:
        msg: "Temporary files cleaned"
