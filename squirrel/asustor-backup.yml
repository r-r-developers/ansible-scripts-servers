---
- name: Backup Asustor NAS Configuration
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check backup utility
      ansible.builtin.shell: which aus
      register: backup_check
      ignore_errors: true

    - name: Output backup utility status
      ansible.builtin.debug:
        msg: "Backup utility found: {{ backup_check.stdout }}"

    - name: Create configuration backup
      ansible.builtin.shell: /usr/sbin/aus -b /volume1/backups/config-$(date +%Y%m%d).tar.gz
      register: backup_result
      ignore_errors: true

    - name: Output backup result
      ansible.builtin.debug:
        msg: "Backup result:\n{{ backup_result.stdout }}"

    - name: Verify backup created
      ansible.builtin.shell: ls -lh /volume1/backups/config-*.tar.gz | tail -n 5
      register: backup_list
      ignore_errors: true

    - name: Output recent backups
      ansible.builtin.debug:
        msg: "Recent backups:\n{{ backup_list.stdout }}"
